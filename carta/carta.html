<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="carta.css" />
    <title>Happy Birthday Cecely</title>
  </head>
  <body>
    <div class="contenedor">
      <article
        class="carta papel"
        role="article"
        aria-label="Tarjeta de cumpleaños para Cecelyn"
      >
        <section class="mensaje">
          <h1 class="titulo">
            <span class="name">Feliz cumpleaños, <strong>Cecelyn</strong></span>
            <span class="flower" aria-hidden="true">🌸</span>
          </h1>
          <div class="contenido" id="contenido">
            <p
              class="tw-line"
              data-text="¡Hoy el mundo celebra que naciste!"
            ></p>
            <p
              class="tw-line"
              data-text="Y yo celebro la suerte de cruzarme con tu luz 💖,"
            ></p>
            <p
              class="tw-line"
              data-text="esa alegría vibrante, tu calidez al escuchar"
            ></p>
            <p
              class="tw-line"
              data-text="y ese brillo propio que ilumina cualquier lugar al que llegas."
            ></p>
            <br />
            <p
              class="tw-line accent"
              data-text="Deseo que cada mañana empiece con la frescura que te caracteriza,"
            ></p>
            <p
              class="tw-line accent"
              data-text="que tu risa sea la melodía que acompañe tus días,"
            ></p>
            <p
              class="tw-line accent"
              data-text="y que cada sueño encuentre el camino para cumplirse 🌸."
            ></p>
            <br />
            <p
              class="tw-line accent"
              data-text="Los cumpleaños son recordatorios de lo mucho que valemos,"
            ></p>
            <p
              class="tw-line accent"
              data-text="de las huellas que dejamos"
            ></p>
            <p
              class="tw-line accent"
              data-text="y de todo lo hermoso que aún está por venir."
            ></p>
            <p
              class="tw-line accent"
              data-text="Nunca olvides lo especial que sos: hay corazones que sonríen gracias a vos…"
            ></p>
            <p
              class="tw-line accent especial"
              data-text="y el mío siempre encuentra razones en tu sonrisa ✨."
            ></p>
            <br />
              <p
              class="tw-line accent especial"
              data-text="Sos un regalo sin comparación, una melodía que ilumina días."
            ></p>
              <p
              class="tw-line accent especial"
              data-text="Sei meravigliosa… y este brindis es por tu luz, que nunca deja de brillar 🌸"
            ></p>
            <div class="firma">— Para ti, con mucho cariño... Joel</div>
          </div>
        </section>
      </article>
    </div>
    <div class="ink-drop show"></div>
    <script type="module" src="escritura.js" defer></script>
  </body>
</html>

<!--
Hoy florece un nuevo capítulo en tu vida.
Que esté lleno de sueños que se cumplen,
risas que no se olvidan
y sorpresas tan grandes como tu sonrisa.
Disfruta cada instante… este día es todo tuyo. 

Hoy celebramos a una persona llena de luz, alegría
y una sonrisa que lo ilumina todo.
Que este nuevo año llegue cargado de sueños cumplidos,
risas infinitas y momentos que guardes para siempre.
Vive cada instante y celebra a lo grande,
porque este día es solo para ti.
-->
